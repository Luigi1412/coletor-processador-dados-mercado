[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-data-pipeline"
version = "1.0.0"
description = "Coletor e Processador de Dados de Mercado — Inteli × BTG Pactual (Grupo 4)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "yfinance>=0.2.40",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1.5",
  "pyarrow>=17.0.0",
  "typer>=0.12.0",
  "rich>=13.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
]

[project.scripts]
market-data = "market_data_pipeline.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["market_data_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: testes que exigem rede (yfinance)",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]
